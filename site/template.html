<style>
/* Visual language follows the Principles of Diffusion Models tutorial site (d-llms.com/neurips26):
   an all-ink page, serif display type, mono labels, indigo/teal accents and a denoising-grid hero.
   The page is dark in every colour scheme, like that site. Venue colours are reserved for data. */
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --bg-2: #141b33;
  --surface: #11172b;
  --surface-2: #19203a;
  --ink: #eef0f8;
  --ink-2: #aab0c6;
  --muted: #8890b0;
  --label: #a7adc4;
  --line: rgba(255,255,255,.14);
  --line-soft: rgba(255,255,255,.08);
  --line-2: rgba(255,255,255,.24);
  --accent: #5b53ff;
  --accent-lt: #a09bff;
  --teal: #12b3a6;
  --teal-lt: #4fd6cb;
  --pick: #e0b055;
  --sydney: #3987e5;
  --atlanta: #d95926;
  --paris: #199e70;
  --r: 14px;
  --navh: 68px;
  --maxw: 1180px;
  --pad: clamp(16px, 4vw, 48px);
  --shadow: 0 12px 34px -18px rgba(0,0,0,.7);
  --f-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body: "Newsreader", Georgia, serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"], :root[data-theme="light"] { color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
::selection { background: var(--accent); color: #fff; }
:focus-visible { outline: 2.5px solid var(--accent-lt); outline-offset: 3px; border-radius: 3px; }
[hidden] { display: none !important; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; line-height: 1.12; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding-left: max(var(--pad), env(safe-area-inset-left, 0px)); padding-right: max(var(--pad), env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-size: .84em; letter-spacing: .01em; }
.muted { color: var(--muted); }
.skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: #fff; padding: 12px 18px; z-index: 200; border-radius: 0 0 8px 0; font: 500 13px var(--f-mono); }
.skip:focus { left: 0; }

/* ---------- shared type */
.eyebrow { font-family: var(--f-mono); font-weight: 400; line-height: 1.6; font-size: 12.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--label); display: inline-flex; align-items: center; gap: .7em; margin: 0 0 18px; }
.eyebrow::before { content: ""; width: 26px; height: 1px; background: rgba(255,255,255,.22); display: inline-block; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- buttons */
.btn { display: inline-flex; align-items: center; gap: .55em; font: 500 12.5px var(--f-mono); letter-spacing: .04em; padding: 10px 16px; border-radius: 999px; text-decoration: none; border: 1px solid var(--line-2); background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; transition: transform .18s ease, background .2s ease, box-shadow .2s ease, border-color .2s ease, color .2s ease; }
.btn:hover { border-color: var(--accent-lt); color: var(--accent-lt); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 10px 24px -10px rgba(91,83,255,.7); }
.btn.primary:hover { color: #fff; transform: translateY(-2px); box-shadow: 0 16px 30px -12px rgba(91,83,255,.8); }
.btn.lg { padding: 14px 22px; font-size: 13.5px; }
.btn.ghost-hero { color: #fff; border-color: rgba(255,255,255,.4); }
.btn.ghost-hero:hover { color: var(--accent-lt); border-color: var(--accent-lt); transform: translateY(-2px); }
.btn[aria-pressed="true"] { border-color: var(--pick); color: var(--pick); background: rgba(224,176,85,.1); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn .arr { font-size: 1.05em; line-height: 1; }

/* ---------- nav */
header.nav { position: fixed; inset: 0 0 auto 0; z-index: 100; padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid transparent; transition: background .3s ease, box-shadow .3s ease, border-color .3s ease; }
header.nav.scrolled { background: rgba(11,16,32,.84); -webkit-backdrop-filter: saturate(160%) blur(12px); backdrop-filter: saturate(160%) blur(12px); border-bottom-color: rgba(255,255,255,.1); box-shadow: 0 1px 20px -12px rgba(0,0,0,.8); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 18px; height: var(--navh); max-width: var(--maxw); margin: 0 auto; padding-left: max(var(--pad), env(safe-area-inset-left, 0px)); padding-right: max(var(--pad), env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: #f5f2ec; font: 13px/1.15 var(--f-mono); letter-spacing: .02em; white-space: nowrap; }
.brand .mark { width: 26px; height: 26px; flex: none; border-radius: 7px; }
.brand b { font-weight: 600; }
.brand .sub { color: var(--accent-lt); }
.nav-links { display: flex; align-items: center; gap: 2px; list-style: none; margin: 0; padding: 0; }
.nav-links a { display: inline-flex; align-items: center; gap: 7px; font: 500 12px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; text-decoration: none; color: rgba(245,242,236,.82); padding: 8px 11px; border-radius: 8px; transition: color .2s ease, background .2s ease; white-space: nowrap; }
.nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--accent-lt); background: rgba(160,155,255,.1); }
.nav-links a.cta { color: #fff; background: var(--accent); margin-left: 6px; }
.nav-links a.cta:hover { background: #4a42e6; color: #fff; }
.nav-links a.cta[aria-current="page"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent-lt); }
.nav-links .count { font-size: 10.5px; opacity: .75; letter-spacing: 0; }
.nav-links .count:empty { display: none; }
.tzpick { display: flex; align-items: center; margin-left: 8px; }
.tzpick select { background: transparent; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 6px 10px; font: 500 12px var(--f-mono); color: #f5f2ec; cursor: pointer; }
.tzpick select option { background: var(--bg-2); color: var(--ink); }
.nav-toggle { display: none; background: none; border: 1px solid rgba(245,242,236,.3); color: #f5f2ec; width: 42px; height: 42px; border-radius: 10px; font-size: 20px; cursor: pointer; align-items: center; justify-content: center; position: relative; z-index: 130; }
.nav-back { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(11,16,32,.55); z-index: 110; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }

/* ---------- hero (denoising grid) */
.hero { position: relative; background: var(--bg); color: #fff; overflow: hidden; isolation: isolate; }
#hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .55; }
.hero-veil { position: absolute; inset: 0; z-index: 1; background:
  radial-gradient(120% 90% at 20% 15%, rgba(11,16,32,.15), rgba(11,16,32,.72) 62%, rgba(11,16,32,.94) 100%),
  linear-gradient(180deg, rgba(11,16,32,.55) 0%, rgba(11,16,32,.2) 40%, rgba(11,16,32,.85) 100%); }
.hero-inner { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; min-height: min(100svh, 880px); padding: calc(env(safe-area-inset-top, 0px) + 140px) max(var(--pad), env(safe-area-inset-right, 0px)) 104px max(var(--pad), env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.kicker { font: 400 clamp(13px, 1.4vw, 16px) var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--accent-lt); margin: 0 0 30px; display: flex; align-items: center; justify-content: center; gap: .8em; flex-wrap: wrap; }
.kicker .kdot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal-lt); box-shadow: 0 0 12px var(--teal-lt); }
.hero h1 { font-size: clamp(40px, 7.2vw, 92px); line-height: 1.04; letter-spacing: -.03em; }
.hero h1 .ln { display: block; }
.hero h1 .grad { background: linear-gradient(100deg, var(--accent-lt), var(--teal-lt)); -webkit-background-clip: text; background-clip: text; color: transparent; font-style: italic; font-weight: 400; padding-right: .06em; }
.hchips { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 44px 0 40px; }
.hchip { display: flex; flex-direction: column; gap: 3px; padding: 12px 18px; border: 1px solid rgba(255,255,255,.16); border-radius: 12px; background: rgba(255,255,255,.03); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); text-align: left; }
.hchip .k { font: 400 10.5px var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: #9098b6; }
.hchip .v { font: 600 19px var(--f-display); color: #fff; letter-spacing: -.01em; }
.hchip.accent { border-color: rgba(160,155,255,.5); background: rgba(91,83,255,.12); }
.hchip.accent .v { color: var(--accent-lt); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center; }
.scroll-hint { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 2; font: 400 10.5px var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: #8890b0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.scroll-hint .line { width: 1px; height: 36px; background: linear-gradient(var(--accent-lt), transparent); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .3; transform: scaleY(.6); } 50% { opacity: 1; transform: scaleY(1); } }

/* ---------- views */
.view { padding-block: clamp(64px, 9vw, 112px) 96px; border-top: 1px solid rgba(255,255,255,.08); }
body:not(.home) .view { padding-top: calc(env(safe-area-inset-top, 0px) + var(--navh) + clamp(36px, 6vw, 64px)); border-top: 0; }
.vhead, #f-active { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--navh) + 24px); }
.vhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }

/* filters: one row, wraps */
.filters { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.search { flex: 1 1 280px; min-width: 0; position: relative; }
.search input { width: 100%; padding: 10px 16px 10px 40px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.04); color: var(--ink); font-size: 16px; font-family: var(--f-body); }
.search input::placeholder { color: var(--muted); }
.search input:focus { border-color: var(--accent-lt); outline: none; box-shadow: 0 0 0 3px rgba(160,155,255,.2); }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 2px; flex: none; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font: 500 11.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--accent); }
.sel { border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 12px; background: transparent; font: 500 11.5px var(--f-mono); letter-spacing: .04em; color: var(--ink); cursor: pointer; }
.sel option { background: var(--bg-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { border: 1px solid var(--line); background: rgba(255,255,255,.03); border-radius: 999px; padding: 5px 14px; font: 400 15px var(--f-body); cursor: pointer; display: inline-flex; gap: 8px; align-items: baseline; color: var(--ink-2); transition: border-color .18s ease, color .18s ease, background .18s ease; }
.chip:hover { border-color: var(--accent-lt); color: var(--ink); }
.chip .n { font: 500 11px var(--f-mono); color: var(--muted); }
.chip[aria-pressed="true"] { background: rgba(91,83,255,.2); border-color: var(--accent-lt); color: #fff; }
.chip[aria-pressed="true"] .n { color: var(--accent-lt); }
.chip:disabled { opacity: .4; cursor: default; }
.chip:disabled:hover { border-color: var(--line); color: var(--ink-2); }
.active-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; font: 500 11.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.active-filters .x { border: 1px dashed var(--line-2); border-radius: 999px; padding: 4px 12px; background: transparent; cursor: pointer; color: var(--ink); font: 500 11.5px var(--f-mono); letter-spacing: .02em; text-transform: none; }
.active-filters .x:hover { border-color: var(--accent-lt); color: var(--accent-lt); }
.resline { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 30px 0 4px; }
.resline b { font: 600 22px var(--f-display); color: #fff; }

/* session group */
.group { margin-top: 26px; }
.group-h { display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; padding: 14px 2px 10px; border-bottom: 1px solid var(--line); position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--navh)); background: var(--bg); z-index: 5; }
.group-h h3 { font-size: 20px; display: flex; align-items: center; gap: 9px; color: #fff; }
.group-h .when { font: 500 12.5px var(--f-mono); color: var(--accent-lt); letter-spacing: .03em; }
.group-h .n { margin-left: auto; font: 500 12px var(--f-mono); color: var(--muted); }

/* paper card */
.cards { display: grid; gap: 12px; margin-top: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 9px; min-width: 0; transition: border-color .2s ease, box-shadow .2s ease; }
.card:hover { border-color: rgba(160,155,255,.55); box-shadow: var(--shadow); }
.card.picked { border-color: var(--pick); box-shadow: inset 3px 0 0 var(--pick); }
.card-top { display: flex; gap: 12px; align-items: flex-start; }
.card-top .meta { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.card h4 { font-size: 20.5px; line-height: 1.25; color: #fff; text-wrap: pretty; }
.card h4 button { all: unset; cursor: pointer; }
.card h4 button:hover { color: var(--accent-lt); }
.card h4 button:focus-visible { outline: 2.5px solid var(--accent-lt); outline-offset: 3px; border-radius: 3px; }
.authors { font-size: 15px; color: var(--ink-2); line-height: 1.45; }
.authors .more { color: var(--muted); }
.tldr { margin: 0; font-size: 16.5px; color: #dfe2f0; line-height: 1.5; }
.where { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; color: var(--ink-2); align-items: center; }
.where .w { display: inline-flex; align-items: center; gap: 7px; }
.where .mono { color: var(--accent-lt); }
.badge { display: inline-flex; align-items: center; gap: 5px; font: 500 10px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--label); white-space: nowrap; }
.badge.oral { color: var(--teal-lt); border-color: rgba(79,214,203,.45); background: rgba(18,179,166,.12); }
.badge.oral::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--teal-lt); }
.badge.spot { color: var(--accent-lt); border-color: rgba(160,155,255,.45); background: rgba(91,83,255,.14); }
.badge.sm { font-size: 9px; padding: 3px 7px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font: 500 11.5px var(--f-mono); color: var(--ink-2); background: rgba(255,255,255,.05); border: 1px solid var(--line-soft); border-radius: 999px; padding: 2px 9px; cursor: pointer; }
.tag:hover { color: #fff; border-color: var(--line-2); }
.tag[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.actions { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font: 500 12.5px var(--f-mono); }
.actions a { color: var(--accent-lt); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; text-decoration-color: rgba(160,155,255,.4); transition: color .18s ease, text-decoration-color .18s ease; }
.actions a:hover { color: #fff; text-decoration-color: #fff; }
details.abs summary { cursor: pointer; list-style: none; font: 500 12px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-lt); display: inline-flex; align-items: center; gap: 8px; }
details.abs summary::-webkit-details-marker { display: none; }
details.abs summary::after { content: "+"; font-size: 15px; line-height: 1; transition: transform .2s ease; }
details.abs[open] { flex-basis: 100%; }
details.abs[open] summary::after { transform: rotate(45deg); }
details.abs p { margin: 10px 0 2px; font: 400 16px/1.6 var(--f-body); letter-spacing: 0; text-transform: none; color: var(--ink-2); max-width: 85ch; }
.star { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-2); background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--muted); transition: color .18s ease, border-color .18s ease, background .18s ease; }
.star:hover { color: var(--pick); border-color: var(--pick); }
.star[aria-pressed="true"] { color: var(--pick); border-color: var(--pick); background: rgba(224,176,85,.12); }
.star svg { width: 17px; height: 17px; }
.empty { padding: 44px 20px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line-2); border-radius: var(--r); background: rgba(255,255,255,.02); }
.empty h3 { font-size: 24px; margin-bottom: 8px; color: #fff; }
.empty p { margin: 0 0 14px; }

/* ---------- schedule */
.weekwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.week { border-collapse: collapse; width: 100%; min-width: 1000px; font-size: 13px; table-layout: fixed; }
table.week col.vcol { width: 136px; }
table.week th, table.week td { border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); padding: 10px 9px; vertical-align: top; text-align: left; }
table.week tr > *:last-child { border-right: 0; }
table.week tbody tr:last-child > * { border-bottom: 0; }
table.week thead th { font: 500 10.5px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: rgba(255,255,255,.02); }
table.week thead th b { display: block; color: #fff; font: 600 17px var(--f-display); letter-spacing: -.01em; text-transform: none; margin-bottom: 2px; }
table.week tbody th { font: 600 17px var(--f-display); color: #fff; }
table.week tbody th small { display: block; font: 400 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
table.week td.off { background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.035) 6px 7px); }
.phase { font: 500 10px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.slot { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.03); padding: 6px 8px; margin-top: 6px; cursor: pointer; font: 400 13.5px/1.35 var(--f-body); color: var(--ink); }
.slot:hover { border-color: var(--accent-lt); }
.slot b { font-weight: 500; }
.slot .mono { color: var(--accent-lt); font-size: 11px; display: block; }
.slot.hl { background: var(--accent); color: #fff; border-color: var(--accent); }
.slot.hl .mono { color: #fff; opacity: .8; }
.days { display: grid; gap: 30px; margin-top: 40px; }
.sched { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); scroll-margin-top: calc(var(--navh) + 20px); }

<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("dd-data").textContent);
const { meta, papers, events, sessions } = DATA;
const $ = (s, el = document) => el.querySelector(s);
const VENUES = meta.venues.map(v => v.key);
const VMETA = Object.fromEntries(meta.venues.map(v => [v.key, v]));
const CATS = meta.cats;
const CATL = Object.fromEntries(CATS.map(c => [c.key, c.label]));
const USER_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
const PBYID = Object.fromEntries(papers.map(p => [p.id, p]));
const EBYID = Object.fromEntries(events.map(e => [e.id, e]));
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- small utils */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const GREEK = { alpha: "α", beta: "β", gamma: "γ", delta: "δ", epsilon: "ε", varepsilon: "ε", eta: "η", lambda: "λ", mu: "μ", nu: "ν", pi: "π", rho: "ρ", sigma: "σ", tau: "τ", theta: "θ", phi: "φ", varphi: "φ", psi: "ψ", omega: "ω", chi: "χ", kappa: "κ", Delta: "Δ", Omega: "Ω", Sigma: "Σ", Pi: "Π", Gamma: "Γ", infty: "∞", times: "×", to: "→", rightarrow: "→", leftarrow: "←", leq: "≤", geq: "≥", le: "≤", ge: "≥", approx: "≈", ell: "ℓ", cdot: "·", log: "log", star: "⋆", sim: "∼", mid: "|", neq: "≠", in: "∈", sqrt: "√", cdots: "⋯", ldots: "…", dots: "…" };
const tex = s => !s || (s.indexOf("$") < 0 && s.indexOf("\\") < 0) ? s : s
  .replace(/\$\$?([^$]{1,160}?)\$\$?/g, (_, inner) => inner
    .replace(/\\(?:text|mathrm|mathbf|boldsymbol|mathcal|mathit|textbf|texttt|textsc|operatorname|mathbb|bm|emph|textit)\s*\{([^{}]*)\}/g, "$1")
    .replace(/\\([A-Za-z]+)/g, (m, n) => GREEK[n] ?? n)
    .replace(/[{}]/g, "").replace(/\\,|\\;|\\!/g, " "))
  .replace(/\\(?:textbf|textit|emph|texttt)\{([^{}]*)\}/g, "$1");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const ICON_STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="currentColor"/></svg>';
const ICON_STAR_O = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;

/* ---------- time */
let tzMode = store.get("dd26-tz", "venue");
const tzFor = v => tzMode === "local" ? USER_TZ : (VMETA[v]?.tz || "UTC");
const fmtCache = new Map();
function fmt(iso, tz, opts, loc = "en-GB") {
  const key = loc + tz + JSON.stringify(opts);
  if (!fmtCache.has(key)) fmtCache.set(key, new Intl.DateTimeFormat(loc, { timeZone: tz, ...opts }));
  return fmtCache.get(key).format(new Date(iso));
}
const hm = (iso, tz) => fmt(iso, tz, { hour: "2-digit", minute: "2-digit", hour12: false });
const dayLabel = (iso, tz) => fmt(iso, tz, { weekday: "short", day: "numeric", month: "short" });

function tzAbbr(v, iso) {
  if (tzMode === "venue" && VMETA[v]) return VMETA[v].abbr;
  try { return new Intl.DateTimeFormat("en-US", { timeZone: USER_TZ, timeZoneName: "short" }).formatToParts(new Date(iso)).find(x => x.type === "timeZoneName").value; } catch { return ""; }
}
function when(iso, end, v, withDay = true) {
  if (!iso) return "Time not announced";
  const tz = tzFor(v);
  return (withDay ? dayLabel(iso, tz) + ", " : "") + hm(iso, tz) + (end ? "–" + hm(end, tz) : "") + " " + tzAbbr(v, iso);
}

/* ---------- stars */
let stars = new Set(store.get("dd26-stars", []));
const isStar = k => stars.has(k);
function toggleStar(k) {
  stars.has(k) ? stars.delete(k) : stars.add(k);
  store.set("dd26-stars", [...stars]);
  document.querySelectorAll(`[data-star="${k}"]`).forEach(b => paintStar(b));
  document.querySelectorAll(`[data-card="${k}"]`).forEach(c => c.classList.toggle("picked", isStar(k)));
  updateCounts();
  if (view === "agenda") renderAgenda();
}
function paintStar(b) {
  const on = isStar(b.dataset.star);
  b.setAttribute("aria-pressed", on);
  const label = b.dataset.label || "this";
  if (b.classList.contains("star")) { b.innerHTML = on ? ICON_STAR : ICON_STAR_O; b.title = on ? "Remove from my agenda" : "Add to my agenda"; b.setAttribute("aria-label", (on ? "Remove " : "Add ") + label + (on ? " from" : " to") + " my agenda"); }
  else b.innerHTML = (on ? ICON_STAR : ICON_STAR_O).replace("<svg", '<svg width="15" height="15"') + (on ? " In my agenda" : " Add to my agenda");
}
const starBtn = (k, label) => `<button class="star" type="button" data-star="${k}" data-label="${esc(label)}"></button>`;

/* ---------- shared bits */
const venueDot = v => v ? `<span class="dot ${v}" aria-hidden="true"></span>` : "";
const decBadge = (p, sm = false) => p.dec === "oral" ? `<span class="badge oral${sm ? " sm" : ""}">Oral</span>` : p.dec === "spotlight" ? `<span class="badge spot${sm ? " sm" : ""}">Spotlight</span>` : "";
function authorLine(p, n = 6) {
  const names = p.au.map(a => esc(a[0]));

const heroGrid = (() => {

})();

      <div><span class="mono">${esc(when(e.s, e.e, e.v))}</span></div>
    </div>`;
  const links = `<div class="actions">${e.web ? `<a href="${esc(e.web)}" target="_blank" rel="noopener">Website ↗</a>` : ""}<a href="${esc(e.url)}" target="_blank" rel="noopener">NeurIPS page ↗</a>${e.or ? `<a href="${esc(e.or)}" target="_blank" rel="noopener">OpenReview ↗</a>` : ""}</div>`;
  const label = e.kind === "tutorial" ? "Tutorial" : "Workshop";
  const head = `<div class="ev-row"><div class="kind"><span class="pill${e.rel === "core" ? " core" : ""}">${label}</span>${e.rel === "core" || !e.note ? "" : `<span class="note">${esc(e.note)}</span>`}</div>${starBtn("e:" + e.id, e.t)}</div>`;
  const abs = e.abs ? (feature ? `<p>${esc(e.abs)}</p>` : `<details class="abs"><summary>About</summary><p>${esc(e.abs)}</p></details>`) : "";
  const cls = `ev${e.rel === "core" ? " core" : ""}${feature ? " feature" : ""}`;
  if (feature) return `<article class="${cls}" id="ev-${e.id}"><div class="ev-main">${head}<h3>${esc(e.t)}</h3><div class="org">${e.org.map(esc).join(" · ")}</div>${abs}</div><div class="ev-main">${facts}${links}</div></article>`;
  return `<article class="${cls}" id="ev-${e.id}">${head}<h3>${esc(e.t)}</h3>${facts}<div class="org">${e.org.map(esc).join(" · ")}</div>${abs}${links}</article>`;
}

/* ---------- agenda */
function agendaItems() {
  const out = [];
  for (const k of stars) {
    const [t, id] = [k.slice(0, 1), k.slice(2)];
    if (t === "p" && PBYID[id]) {
      const p = PBYID[id];
      if (p.s) out.push({ k, s: p.s, e: p.e, v: p.v, title: tex(p.t), kind: "Poster", where: `${shortSession(p.ps)}${p.room ? " · " + p.room : ""}${p.pos ? " · " + p.pos : ""}`, pid: id });
      if (p.oral) out.push({ k, s: p.oral.s, e: p.oral.e, v: p.oral.v, title: tex(p.t), kind: "Talk", where: `${shortSession(p.oral.ses)} · ${p.oral.room}`, pid: id });
      if (!p.s && !p.oral) out.push({ k, s: "", e: "", v: p.v, title: tex(p.t), kind: "Poster", where: "Time not announced", pid: id });
    } else if (t === "e" && EBYID[id]) {
      const e = EBYID[id];
      out.push({ k, s: e.s, e: e.e, v: e.v, title: e.t, kind: e.kind === "tutorial" ? "Tutorial" : "Workshop", where: e.room, eid: id });
    }
  }
  out.sort((a, b) => (a.s || "~").localeCompare(b.s || "~"));
  for (const a of out) a.clash = out.filter(b => b !== a && a.s && b.s && a.s < b.e && b.s < a.e && b.k !== a.k);
  return out;
}
function renderAgenda() {
  const items = agendaItems(), el = $("#agenda-list");
  $("#copy-agenda").disabled = $("#clear-agenda").disabled = !items.length;
  if (!items.length) {
    el.innerHTML = `<div class="empty"><h3>Nothing starred yet</h3><p>Star papers, talks and workshops with ${ICON_STAR_O.replace("<svg", '<svg width="15" height="15" style="vertical-align:-2px"')} and they will line up here by time, with overlaps flagged.</p><button class="btn primary" type="button" id="seed">Add the tutorial and both workshops</button></div>`;
    $("#seed").onclick = () => { events.filter(e => e.rel === "core").forEach(e => stars.add("e:" + e.id)); store.set("dd26-stars", [...stars]); updateCounts(); renderAgenda(); };
    return;
  }
  el.innerHTML = `<div class="days" style="margin-top:0">${groupByDay(items).map(([k, d]) => `<section class="sched day">${dayHead(d, "Starred", d.items.length)}${d.items.map(it => {
    return `<div class="sched-row">${timeCell(it)}<div class="body"><div class="sub">${venueDot(it.v)}<span>${it.v || ""}</span><span class="pill">${it.kind}</span><span>${esc(it.where)}</span></div><div class="ttl">${it.pid ? `<a href="#p-${it.pid}">${esc(it.title)}</a>` : `<a href="#events" data-evlink="${it.eid}">${esc(it.title)}</a>`}</div>${it.clash.length ? `<span class="conflict">Overlaps with ${esc(it.clash.map(c => c.title.length > 48 ? c.title.slice(0, 46) + "…" : c.title).join("; "))}</span>` : ""}</div>${starBtn(it.k, it.title)}</div>`;
  }).join("")}</section>`).join("")}</div>`;
  el.querySelectorAll("[data-star]").forEach(paintStar);
}
function bindAgenda() {
  $("#copy-agenda").addEventListener("click", async () => {
    const lines = agendaItems().map(it => `${it.s ? when(it.s, it.e, it.v) : "TBA"} | ${it.v || ""} | ${it.kind} | ${it.title} | ${it.where}`);
    const text = "My NeurIPS 2026 discrete diffusion agenda\n\n" + lines.join("\n");
    const b = $("#copy-agenda");
    try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; }
    catch { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "width:100%;height:160px;margin-bottom:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px var(--f-mono)"; ta.setAttribute("aria-label", "Agenda text"); $("#agenda-list").prepend(ta); ta.select(); b.textContent = "Select and copy the text below"; }
    setTimeout(() => b.textContent = "Copy as text", 2200);
  });
  const clr = $("#clear-agenda");
  clr.addEventListener("click", () => {
    if (clr.dataset.armed) { stars.clear(); store.set("dd26-stars", []); delete clr.dataset.armed; clr.textContent = "Clear"; updateCounts(); renderAgenda(); return; }
    clr.dataset.armed = "1"; clr.textContent = "Select again to clear all";
    setTimeout(() => { delete clr.dataset.armed; clr.textContent = "Clear"; }, 3000);
  });
  $("#agenda-list").addEventListener("click", e => { const ev = e.target.closest("[data-evlink]"); if (ev) { e.preventDefault(); gotoEvent(ev.dataset.evlink); } });
}

/* ---------- paper drawer */
let lastFocus = null;
function openPaper(id) {
  const p = PBYID[id]; if (!p) return;
  lastFocus = document.activeElement;
  const k = "p:" + id, d = $("#drawer");
  const inst = [...new Set(p.au.map(a => a[1]).filter(Boolean))];
  d.innerHTML = `<button class="btn close" type="button" id="d-close">Close ✕</button>
    <div class="card-top"><div class="meta">${decBadge(p)}<span>${esc(CATL[p.cat])}</span><span>· ${esc(p.track)} track</span></div></div>
    <h2 id="d-title">${esc(tex(p.t))}</h2>
    <div class="au">${p.au.map(a => `<span>${esc(a[0])}${a[1] ? ` <small>${esc(a[1])}</small>` : ""}</span>`).join("")}</div>
    ${p.tldr ? `<p class="tl">${esc(tex(p.tldr))}</p>` : ""}
    <div class="box"><span class="k">Poster</span><span>${venueDot(p.v)} ${esc(p.v || "")} · ${esc(shortSession(p.ps) || "Not scheduled")}</span><span class="mono">${esc(when(p.s, p.e, p.v))}</span><span>${esc(p.room || "")}${p.pos ? ` · board <span class="mono">${esc(p.pos)}</span>` : ""}</span></div>
    ${p.oral ? `<div class="box"><span class="k">Oral talk</span><span>${venueDot(p.oral.v)} ${esc(p.oral.ses)}</span><span class="mono">${esc(when(p.oral.s, p.oral.e, p.oral.v))}</span><span>${esc(p.oral.room)}</span></div>` : ""}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" data-star="${k}"></button>${p.or ? `<a class="btn" href="${esc(p.or)}" target="_blank" rel="noopener">OpenReview ↗</a>` : ""}<a class="btn" href="https://neurips.cc/virtual/2026/poster/${p.id}" target="_blank" rel="noopener">NeurIPS page ↗</a>${p.code ? `<a class="btn" href="${esc(p.code)}" target="_blank" rel="noopener">Code ↗</a>` : ""}</div>
    ${p.abs ? `<div><p class="eyebrow" style="margin-bottom:10px">Abstract</p><p>${esc(tex(p.abs))}</p></div>` : ""}
    <div class="foot">NeurIPS subject area: ${esc(p.topic || "—")}${inst.length ? ` · ${plural(inst.length, "institution")}` : ""}${p.tags.length ? " · " + p.tags.map(t => "#" + esc(t)).join(" ") : ""}</div>`;
  d.querySelectorAll("[data-star]").forEach(paintStar);
  d.hidden = false; $("#scrim").hidden = false;
  $("#d-close").focus();
}
function closePaper() {
  if ($("#drawer").hidden) return;
  $("#drawer").hidden = true; $("#scrim").hidden = true;
  if (location.hash.startsWith("#p-")) safeReplace("#" + (view || HOME));
  lastFocus?.focus?.();
}

/* ---------- routing */
function safeReplace(h) { try { history.replaceState(null, "", h); } catch {} }
let view = "", pendingScroll = "";
const VIEWS = ["schedule", "papers", "events", "agenda"];
const HOME = "schedule";
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith("p-")) { if (!view) show("papers"); openPaper(h.slice(2)); return; }
  closePaper();
  show(VIEWS.includes(h) ? h : HOME);
}
function show(v) {
  const changed = v !== view;
  view = v;
  document.body.classList.toggle("home", v === HOME);
  $("#hero").hidden = v !== HOME;
  heroGrid.set(v === HOME);
  document.querySelectorAll(".view").forEach(s => s.hidden = s.dataset.view !== v);
  document.querySelectorAll("#nav-links a[data-view]").forEach(a => a.dataset.view === v ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  if (v === "papers") renderPapers();
  if (v === "schedule") renderSchedule();
  if (v === "events") renderEvents();
  if (v === "agenda") renderAgenda();
  if (pendingScroll) {
    const t = $(pendingScroll); pendingScroll = "";
    if (t) requestAnimationFrame(() => t.scrollIntoView({ block: t.classList.contains("ev") ? "center" : "start" }));
  } else if (changed) scrollTo(0, 0);
  navState();
}
function updateCounts() {
  $("#c-papers").textContent = papers.length;
  $("#c-agenda").textContent = stars.size ? stars.size : "";
}

/* ---------- global events */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-star]"); if (s) { toggleStar(s.dataset.star); return; }
  const o = e.target.closest("[data-open]"); if (o) { lastFocus = o; location.hash = "#p-" + o.dataset.open; return; }
  if (e.target.id === "d-close" || e.target.id === "scrim") { safeReplace("#" + view); closePaper(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (!$("#drawer").hidden) { safeReplace("#" + view); closePaper(); }
    else if (navLinks.classList.contains("open")) { setNav(false); navToggle.focus(); }
  }
  if (e.key === "/" && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || "") && view === "papers") { e.preventDefault(); $("#q").focus(); }
});
$("#tz").value = tzMode;
$("#tz").addEventListener("change", e => { tzMode = e.target.value; store.set("dd26-tz", tzMode); show(view); });
window.addEventListener("hashchange", route);
$("#foot").innerHTML = `<p class="foot-links">${meta.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join('<span aria-hidden="true">·</span>')}<span aria-hidden="true">·</span><a href="https://d-llms.com/neurips26/" target="_blank" rel="noopener">The Principles of Diffusion Models tutorial ↗</a></p>
  <p class="foot-bottom">Built ${esc(meta.built)} from the official NeurIPS 2026 programme (${meta.totalAccepted.toLocaleString("en-US")} accepted papers screened). Inclusion, topics and one-line summaries are model-assisted and may contain mistakes; the NeurIPS pages are the source of truth for times and rooms. Design adapted from the <a href="https://d-llms.com/neurips26/" target="_blank" rel="noopener">tutorial site ↗</a>.</p>`;

renderHero(); syncFilters(); bindPapers(); bindSchedule(); bindAgenda(); updateCounts(); route();
})();
</script>
